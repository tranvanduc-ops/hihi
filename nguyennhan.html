            <h2 style="color:#0756A5;">⚠️ NGUYÊN NHÂN GÂY TAI NẠN</h2>

            <ol>
                <li>Không chấp hành luật giao thông.</li>
                <li>Sử dụng điện thoại khi điều khiển phương tiện.</li>
                <li>Phóng nhanh, vượt ẩu, không quan sát.</li>
                <li>Điều kiện thời tiết và đường sá không thuận lợi.</li>
                <li>Phương tiện không được kiểm tra, bảo dưỡng phù hợp.</li>
            </ol>
